name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build API & Bot
        run: npx nx run-many -t build -p api telegram-bot

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          tags: fridge-api:latest
          outputs: type=docker,dest=/tmp/fridge-api.tar

      - name: Build Bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/telegram-bot.Dockerfile
          tags: fridge-bot:latest
          outputs: type=docker,dest=/tmp/fridge-bot.tar

      - name: Copy images to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: /tmp/fridge-api.tar,/tmp/fridge-bot.tar
          target: /tmp
          strip_components: 1

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e

            # Write env file from GitHub Secrets
            cat > /opt/fridge-assist/.env << 'ENVEOF'
            ${{ secrets.ENV_FILE }}
            ENVEOF

            # Load Docker images
            docker load -i /tmp/fridge-api.tar
            docker load -i /tmp/fridge-bot.tar

            # Pull latest code (for docker-compose.yml updates)
            cd /opt/fridge-assist
            git pull origin main

            # Restart containers
            docker compose down
            docker compose up -d

            # Clean up
            rm -f /tmp/fridge-api.tar /tmp/fridge-bot.tar
            docker image prune -f

            # Verify
            echo "Waiting for containers to start..."
            sleep 10
            docker compose ps
